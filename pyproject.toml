[project]
name = "telegram-mcp"
version = "0.3.0"
description = "MCP server that lets Claude read Telegram channel posts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "telethon>=1.36",
]

[project.scripts]
telegram-mcp = "telegram_mcp.server:main"
telegram-mcp-login = "telegram_mcp.login:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_mcp"]
