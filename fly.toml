# Fly.io: fly launch --copy-config --no-deploy && fly volumes create data --size 1 && fly deploy
app = "telegram-mcp"          # change to a unique name
primary_region = "ams"

[build]

[env]
  PORT = "8000"
  TELEGRAM_MCP_HOME = "/data"

[mounts]
  source = "data"
  destination = "/data"        # archives, notes, seen-state, interest profile survive redeploys

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"  # sleeps when idle, wakes on the next request (~1-2 s)
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
